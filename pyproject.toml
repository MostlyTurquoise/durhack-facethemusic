[project]
name = "durhack-facethemusic"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "MostlyTurquoise", email = "107848704+MostlyTurquoise@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "audioop-lts>=0.2.2",
    "flask>=3.1.3",
    "musicpy>=7.16",
    "numpy>=2.5.4",
    "pedalboard>=0.9.26",
    "pydub>=0.25.1",
    "scipy>=1.18.1",
    "sf2-loader>=1.29",
]

[project.scripts]
durhack-facethemusic = "durhack_facethemusic:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
