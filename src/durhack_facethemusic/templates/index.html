<!doctype html>
<html>
    <head>
        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='styles.css') }}"
        />

        <title>Face the Music!</title>
    </head>

    <body>
        <h1>Face the Music!</h1>

        <p>
            Select a date from the range, and watch it convert the stock data
            from that timeframe into music!
        </p>
        <canvas
            class="stockGraph"
            id="stockGraph"
            width="500"
            height="250"
        ></canvas>
        <br />
        <div class="dateRange">
            <input
                type="datetime-local"
                id="startTime"
                value="2026-07-01T00:00"
                min="2026-07-01T00:00"
                max="2026-08-31T23:00"
            />
            to
            <input
                type="datetime-local"
                id="endTime"
                value="2026-08-31T23:00"
                min="2026-07-01T00:00"
                max="2026-08-31T23:00"
            />
        </div>
        <select id="encoder" class="encoder">
            <option value="markov">Markov</option>
            <option value="harry">Harry</option>
            <option value="stupid">Stupid</option>
            <option value="dummy">Dummy</option>
        </select>

        <button type="submit" id="submitButton" class="inputButton">
            Generate
        </button>

        <p class="error" id="errorMessage"></p>
        <p class="success" id="successMessage"></p>
        <audio class="audioPlayer" id="audioPlayer" controls></audio>
        <script>
            //WIP CANVAS JUST HERE TO TEST.
            const canvas = document.getElementById("stockGraph");
            const ctx = canvas.getContext("2d");
            ctx.moveTo(0, 0);
            ctx.lineTo(200, 100);
            ctx.stroke();

            const startInput = document.getElementById("startTime");
            const endInput = document.getElementById("endTime");
            const encoder = document.getElementById("encoder");
            const submitButton = document.getElementById("submitButton");
            const errorMessage = document.getElementById("errorMessage");
            const successMessage = document.getElementById("successMessage");
            const audioPlayer = document.getElementById("audioPlayer");

            let getUrl = "";
            let transformUrl = "";
            successMessage.textContent = "";
            errorMessage.textContent = "";

            submitButton.addEventListener("click", async () => {
                errorMessage.textContent = "";
                if (!startInput.value || !endInput.value) {
                    errorMessage.textContent =
                        "Must input both start and end dates.";
                    successMessage.style.display = "none";
                    errorMessage.style.display = "block";
                    return;
                }

                const startDate = new Date(startInput.value);
                const endDate = new Date(endInput.value);

                if (endDate <= startDate) {
                    errorMessage.textContent =
                        "End date must be later than start date.";
                    successMessage.style.display = "none";
                    errorMessage.style.display = "block";
                    return;
                }

                getUrl =
                    "/api/get_data?from=" +
                    startDate.toISOString() +
                    "&to=" +
                    endDate.toISOString();
                transformUrl =
                    "/api/transform?from=" +
                    startDate.toISOString() +
                    "&to=" +
                    endDate.toISOString() +
                    "&encoder=" +
                    encoder.value;
                successMessage.textContent = "Generating...";
                try {
                    const responseTransform = await fetch(transformUrl);
                    const responseGet = await fetch(getUrl);

                    if (!responseTransform.ok || !responseGet.ok) {
                        throw new Error("Response status: ${response.status}");
                    }
                    const resultTransform = await responseTransform.blob();
                    const resultGet = await responseGet.json();
                    //errorMessage.textContent = resultGet.data;

                    const sortedValues = resultGet.data.toSorted(
                        (a, b) => a - b,
                    );
                    const low = sortedValues[0];
                    const high = sortedValues[sortedValues.length - 1];

                    let canvas = document.getElementById("stockGraph");
                    const ctx = canvas.getContext("2d");

                    let currentY =
                        250 - ((resultGet.data[0] - low) / (high - low)) * 250;

                    let currentX = 0;

                    for (let i = 0; i < sortedValues.length - 9; i += 10) {
                        ctx.beginPath();
                        let tempX = currentX + 5000 / (sortedValues.length - 1);
                        let tempY =
                            250 -
                            ((resultGet.data[i] - low) / (high - low)) * 250;
                        console.log(tempX, tempY);

                        ctx.moveTo(currentX, currentY);
                        ctx.lineTo(tempX, tempY);
                        if (currentY >= tempY) {
                            ctx.strokeStyle = "green";
                        } else {
                            ctx.strokeStyle = "red";
                        }
                        ctx.stroke();

                        currentX = tempX;
                        currentY = tempY;
                    }

                    audioPlayer.src = URL.createObjectURL(resultTransform);
                    audioPlayer.load();
                    successMessage.textContent = "Successfully generated song!";
                } catch (error) {
                    errorMessage.textContent =
                        "Error generating song. " + error.message;
                    successMessage.textContent = "";
                }
            });
        </script>
    </body>
</html>
