<!doctype html>
<html>

<head>

  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

  <title>Face the Music!</title>
</head>

<body>
  <h1>Face the Music!</h1>
  */USD, YEN, SGD
  <p>Select a date from the range, and watch it convert the stock data from that timeframe into music!</p>
  <div class="dateRange">
    <input type="datetime-local" id="startTime" min="2026-07-01T00:00" max="2026-08-31T23:00">
    <input type="datetime-local" id="endTime" min="2026-07-01T00:00" max="2026-08-31T23:00">
  </div>

  <button type="submit" id="submitButton" class="inputButton">Input</button>
  <p class="errorMsg" id="errorMessage"></p>

  <script>
    const startInput = document.getElementById('startTime');
    const endInput = document.getElementById('endTime');
    const submitButton = document.getElementById('submitButton');
    const errorMessage = document.getElementById('errorMessage');
    let getUrl = ''
    let transformUrl = ''


    submitButton.addEventListener('click', () => {
      errorMessage.textContent = '';
      if (!startInput.value || !endInput.value) {
        errorMessage.textContent = 'Must input both start and end dates.';
        return;
      }

      const startDate = new Date(startInput.value);
      const endDate = new Date(endInput.value);

      if (endDate <= startDate) {
        errorMessage.textContent = 'End date must be later than start date.';
        return;
      }

      getUrl = "/api/get_data?from=" + startDate.toISOString() +"&to=" + endDate.toISOString();
      transformUrl = "/api/transform?from=" + startDate.toISOString() +"&to=" + endDate.toISOString();
      errorMessage.textContent = getUrl + transformUrl;

      fetch()


    });


  </script>

</body>


</html>
